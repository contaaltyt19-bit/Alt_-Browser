<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixar Navegador</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        p.subtitle {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .download-box {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 3rem;
        }

        .btn-download {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            padding: 16px 32px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .btn-download:hover {
            background-color: var(--primary-hover);
        }

        .alt-downloads {
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .alt-downloads a {
            color: var(--primary);
            text-decoration: none;
        }

        .alt-downloads a:hover {
            text-decoration: underline;
        }

        .platforms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 2rem;
        }

        .platform-card {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .badge {
            display: inline-block;
            background-color: #334155;
            color: var(--text-muted);
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 8px;
        }

        footer {
            margin-top: auto;
            padding-top: 2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Meu Navegador</h1>
        <p class="subtitle">Navegue na web com mais velocidade e simplicidade.</p>

        <div class="download-box">
            <a id="main-download-btn" href="#" class="btn-download">Carregando download...</a>
            
            <div class="alt-downloads">
                <span>Outros sistemas: </span>
                <a id="alt-link-1" href="#"></a>
            </div>
        </div>

        <h2 style="font-size: 1.5rem; margin-bottom: 1rem;">Disponibilidade</h2>
        <div class="platforms-grid">
            <div class="platform-card">
                <h3>Windows</h3>
                <span class="badge" style="background-color: #1e3a8a; color: #93c5fd;">Disponível</span>
            </div>
            <div class="platform-card">
                <h3>macOS</h3>
                <span class="badge" style="background-color: #1e3a8a; color: #93c5fd;">Disponível</span>
            </div>
            <div class="platform-card">
                <h3>Telemóvel</h3>
                <span class="badge">Em Breve</span>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Meu Navegador. Todos os direitos reservados.</p>
    </footer>

    <script>
        // Substitua estes URLs pelos links reais dos seus arquivos no GitHub Releases
        const urlWindows = "https://github.com/SEU-USUARIO/SEU-REPOSITORIO/releases/download/v1.0.0/navegador-setup.exe";
        const urlMac = "https://github.com/SEU-USUARIO/SEU-REPOSITORIO/releases/download/v1.0.0/navegador-mac.dmg";

        const userAgent = navigator.userAgent.toLowerCase();
        const mainBtn = document.getElementById('main-download-btn');
        const altLink = document.getElementById('alt-link-1');

        if (userAgent.includes('mac')) {
            mainBtn.textContent = 'Baixar para macOS';
            mainBtn.href = urlMac;
            altLink.textContent = 'Versão para Windows (.exe)';
            altLink.href = urlWindows;
        } else {
            // Padrão para Windows ou outros SOs desktop
            mainBtn.textContent = 'Baixar para Windows';
            mainBtn.href = urlWindows;
            altLink.textContent = 'Versão para macOS (.dmg)';
            altLink.href = urlMac;
        }
    </script>
</body>
</html>
